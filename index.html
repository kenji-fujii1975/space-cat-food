
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zero-G Toss (Cat Hole)</title>
  <style>
    :root{ --bg:#0f1220; --panel:#181c2f; --text:#e6e8f2; --muted:#8a90ad; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; background:radial-gradient(1200px 800px at 50% 20%, #161a2d, var(--bg)); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
      overscroll-behavior:none; touch-action:none;
    }
    #ui{ position:fixed; inset:env(safe-area-inset-top) 0 auto 0; z-index:10; padding:8px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .panel{ background:rgba(24,28,47,0.75); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:8px 10px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
    #score{ font-weight:800; letter-spacing:0.5px; }
    #message{ font-size:13px; color:var(--muted); }
    #canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel" style="gap:14px">
      <span>入った数: <b id="score">0</b></span>
      <span id="message"></span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
  // ==== 固定定数（再宣言ガード） ====
  if (typeof window.SPEED === 'undefined') window.SPEED = 1.5;
  if (typeof window.SPREAD_DEG === 'undefined') window.SPREAD_DEG = 22;
  if (typeof window.HOLE_RADIUS === 'undefined') window.HOLE_RADIUS = 42; // 80%に縮小（元52）
  if (typeof window.BALLS_COUNT === 'undefined') window.BALLS_COUNT = 50;
  if (typeof window.CLEAR_TARGET === 'undefined') window.CLEAR_TARGET = 500; // 500個でクリア
  var SPEED = window.SPEED, SPREAD_DEG = window.SPREAD_DEG, HOLE_RADIUS = window.HOLE_RADIUS, BALLS_COUNT = window.BALLS_COUNT, CLEAR_TARGET = window.CLEAR_TARGET;

  // ==== キャンバス ====
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  var W = 0, H = 0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  // ==== UI参照 ====
  var ui = { score: document.getElementById('score'), msg: document.getElementById('message') };

  // ==== 状態 ====
  var state = {
    balls: [], scored: 0, roundActive: false, clear:false,
    aim: { fromX:null, fromY:null, toX:null, toY:null, active:false },
    t:0,
    gameMode: 'title' // 'title' | 'playing' | 'ending'
  };

  // ==== 入力：画面どこでもタップで発射 or 遷移 ====
  var pointer = { down:false, x:0, y:0 };
  function setAimFromPointer(){ state.aim.fromX=W/2; state.aim.fromY=H-60; state.aim.toX=pointer.x; state.aim.toY=pointer.y; state.aim.active=true; }
  function isUiTarget(el){ return !!(el && el.closest && el.closest('#ui')); }
  function updateXY(e){
    if(e && e.touches && e.touches[0]){ pointer.x=e.touches[0].clientX; pointer.y=e.touches[0].clientY; }
    else if(e && e.changedTouches && e.changedTouches[0]){ pointer.x=e.changedTouches[0].clientX; pointer.y=e.changedTouches[0].clientY; }
    else if(e){ pointer.x=e.clientX; pointer.y=e.clientY; }
  }
  function onDown(e){
    if(isUiTarget(e.target)) return;
    updateXY(e);
    if (state.gameMode === 'title') { startGame(); }
    else if (state.gameMode === 'ending') { goTitle(); }
    else { // playing
      pointer.down=true; setAimFromPointer(); spawnBurst();
    }
    if(e && e.preventDefault) e.preventDefault();
  }
  document.addEventListener('touchstart', onDown, {passive:false});
  document.addEventListener('mousedown', onDown);

  // ==== 乱数 / ボール ====
  var RNG = { rand:function(a,b){ return a+Math.random()*(b-a); } };
  var BALL_R = 5;
  function makeBall(x,y,vx,vy){ return {x:x,y:y,vx:vx,vy:vy,r:BALL_R,alive:true,scored:false}; }

  // 狙い先（タップしない場合は画面やや上）
  function baseAim(){
    var fromX=W/2, fromY=H-60;
    var tx=(state.aim.toX!=null?state.aim.toX:W/2);
    var ty=(state.aim.toY!=null?state.aim.toY:H*0.42);
    var baseAng=Math.atan2(ty-fromY,tx-fromX);
    return {fromX:fromX,fromY:fromY,baseAng:baseAng};
  }

  // 一斉発射（“丸く固まった”ジッタ付き）
  function spawnBurst(){
    if(state.clear) return;
    var base = baseAim(); var a = base.baseAng; var fromX = base.fromX, fromY = base.fromY;
    var POS_JITTER_R = 12;
    for(var i=0;i<BALLS_COUNT;i++){
      var rr = Math.sqrt(Math.random()) * POS_JITTER_R;
      var th = Math.random() * Math.PI * 2;
      var px = fromX + Math.cos(th) * rr;
      var py = fromY + Math.sin(th) * rr;
      var delta = (RNG.rand(-SPREAD_DEG/2, SPREAD_DEG/2)) * Math.PI/180;
      var ang = a + delta;
      var sp = SPEED * RNG.rand(0.9, 1.1);
      var vx = Math.cos(ang) * sp;
      var vy = Math.sin(ang) * sp;
      state.balls.push(makeBall(px, py, vx, vy));
    }
    if(state.balls.length>2000) state.balls.splice(0,state.balls.length-2000);
    state.roundActive=true; ui.msg.textContent='発射！';
  }

  // ==== 穴：画面中央より少し上（透明） ====
  function hole(){ return { x:W/2, y:Math.max(60, H*0.42), r:HOLE_RADIUS }; }
  function checkScored(b){ var h=hole(); var dx=b.x-h.x, dy=b.y-h.y; var dist=Math.hypot(dx,dy); return dist <= (h.r - b.r); }

  // ==== 画像ロード（安全ガード付き） ====
  var bgImg = new Image(), catImg = new Image(), topImg = new Image(), endImg = new Image();
  var bgReady=false, bgError=false, catReady=false, catError=false, topReady=false, topError=false, endReady=false, endError=false;

  // GitHub Pages等のキャッシュ回避用クエリ
  var bust = (Date.now()%1e7).toString(36);

  bgImg.onload = function(){ bgReady=true; };
  bgImg.onerror = function(){ bgError=true; console.warn('[bgImg] 読み込み失敗: back.png'); };
  bgImg.src = 'back.png?v='+bust;

  catImg.onload = function(){ catReady=true; };
  catImg.onerror = function(){ catError=true; console.warn('[catImg] 読み込み失敗: cataan.png'); };
  catImg.src = 'cataan.png?v='+bust;

  topImg.onload = function(){ topReady=true; };
  topImg.onerror = function(){ topError=true; console.warn('[topImg] 読み込み失敗: top.png'); };
  topImg.src = 'top.png?v='+bust;

  endImg.onload = function(){ endReady=true; };
  endImg.onerror = function(){ endError=true; console.warn('[endImg] 読み込み失敗: end.png'); };
  endImg.src = 'end.png?v='+bust;

  // 猫画像の中央配置スケール
  var IMG_SCALE = 0.42;

  // ==== メインループ ====
  function step(){
    if (state.gameMode !== 'playing') return; // タイトル/エンディングでは物理停止
    for (var i=0;i<state.balls.length;i++){
      var b=state.balls[i]; if(!b.alive) continue;
      b.x += b.vx; b.y += b.vy;
      // 画面端で反射（わずかに減衰）
      var e = 0.995;
      if (b.x < b.r) { b.x = b.r; b.vx = -b.vx * e; }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -b.vx * e; }
      if (b.y < b.r) { b.y = b.r; b.vy = -b.vy * e; }
      if (b.y > H - b.r) { b.y = H - b.r; b.vy = -b.vy * e; }
      // スコア判定
      if(!b.scored && checkScored(b)){
        b.scored=true; b.alive=false;
        state.scored++;
        ui.score.textContent=state.scored;
        if(state.scored>=CLEAR_TARGET && !state.clear){
          state.clear=true;
          state.gameMode='ending';
          ui.msg.textContent='🎉 クリア！';
        }
      }
    }
  }

  function draw(){
    // 背景
    if (bgReady && !bgError && bgImg.naturalWidth>0 && bgImg.naturalHeight>0){
      try { ctx.drawImage(bgImg,0,0,W,H); } catch(e) {}
    } else {
      var grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,'#161a2d'); grad.addColorStop(1,'#0f1220');
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    }

    // 画面状態ごとの描画
    if (state.gameMode === 'title') {
      if (topReady && !topError && topImg.naturalWidth>0) {
        try { ctx.drawImage(topImg, 0,0, W,H); } catch(e) {}
      }
      return;
    }

    if (state.gameMode === 'ending') {
      if (endReady && !endError && endImg.naturalWidth>0) {
        try { ctx.drawImage(endImg, 0,0, W,H); } catch(e) {}
      }
      return;
    }

    // playing 中のみ以下を描画
    var h = hole();

    if (catReady && !catError && catImg.naturalWidth>0 && catImg.naturalHeight>0){
      var imgW = Math.min(W * IMG_SCALE, 420);
      var imgH = imgW * (catImg.naturalHeight / catImg.naturalWidth);
      var drawX = (W - imgW) / 2;
      var drawY = (H - imgH) / 2; // 画面中央
      try { ctx.drawImage(catImg, drawX, drawY, imgW, imgH); } catch(e) {}
    }

    // ボール（不透明な茶色）
    ctx.fillStyle = '#8B4513';
    for (var i=0;i<state.balls.length;i++){
      var b=state.balls[i]; if(!b.alive) continue;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }
  }

  function loop(){ step(); draw(); requestAnimationFrame(loop); }
  loop();

  // === 画面遷移ユーティリティ ===
  function resetWorld(){ state.balls.length=0; state.scored=0; state.clear=false; ui.score.textContent=state.scored; ui.msg.textContent=''; }
  function startGame(){ resetWorld(); state.gameMode='playing'; }
  function goTitle(){ resetWorld(); state.gameMode='title'; }
  </script>
</body>
</html>
