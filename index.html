<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ball Toss Zero-G</title>
  <style>
    :root{ --bg:#0f1220; --panel:#181c2f; --text:#e6e8f2; --accent:#6ae7ff; --accent2:#9dff6a; --muted:#8a90ad; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; background:radial-gradient(1200px 800px at 50% 20%, #161a2d, var(--bg)); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
      overscroll-behavior:none; touch-action:none;
    }
    #ui{ position:fixed; inset:env(safe-area-inset-top) 0 auto 0; z-index:10; padding:8px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .panel{ background:rgba(24,28,47,0.75); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:8px 10px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
    .label{ font-size:12px; color:var(--muted); }
    #score{ font-weight:800; letter-spacing:0.5px; }
    #message{ font-size:13px; color:var(--muted); }
    #canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
    #footer{ position:fixed; inset:auto 0 env(safe-area-inset-bottom) 0; z-index:10; display:flex; justify-content:center; pointer-events:none; }
    #tip{ pointer-events:auto; margin:10px; padding:8px 12px; border-radius:12px; background:rgba(24,28,47,0.6); border:1px solid rgba(255,255,255,0.08); font-size:12px; color:var(--muted); }
    #testbar{ position:fixed; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:20; }
    #testbtn{ background:linear-gradient(180deg,#b9bccd,#8f94a8); color:#111; box-shadow:none; font-size:12px; padding:8px 10px; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel" style="gap:14px">
      <span>🎯 入った数: <b id="score">0</b></span>
      <span id="message"></span>
    </div>
    <div class="panel">
      <label class="toggle"><input id="stream" type="checkbox" /> 連続放出</label>
      <span class="label" id="fixedInfo"></span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="footer"><div id="tip">画面のどこでも<strong>タップで即発射</strong><br>300個穴に入るとクリアです。</div></div>

  <div id="testbar"><button id="testbtn">自己診断</button></div>

  <script>
  if (typeof window.SPEED === 'undefined') window.SPEED = 1.5;
  if (typeof window.SPREAD_DEG === 'undefined') window.SPREAD_DEG = 22;
  if (typeof window.HOLE_RADIUS === 'undefined') window.HOLE_RADIUS = 52;
  if (typeof window.BALLS_COUNT === 'undefined') window.BALLS_COUNT = 100;
  if (typeof window.STREAM_RATE === 'undefined') window.STREAM_RATE = 120;
  var SPEED = window.SPEED, SPREAD_DEG = window.SPREAD_DEG, HOLE_RADIUS = window.HOLE_RADIUS, BALLS_COUNT = window.BALLS_COUNT, STREAM_RATE = window.STREAM_RATE;

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  var W = 0, H = 0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  var ui = {
    score: document.getElementById('score'),
    msg: document.getElementById('message'),
    stream: document.getElementById('stream'),
    fixedInfo: document.getElementById('fixedInfo')
  };
  ui.fixedInfo.textContent = `speed:${SPEED} / spread:±${SPREAD_DEG}° / hole:${HOLE_RADIUS}px / balls:${BALLS_COUNT} / rate:${STREAM_RATE}/s`;

  var state = {
    balls: [], scored: 0, roundActive: false,
    aim: { fromX:null, fromY:null, toX:null, toY:null, active:false },
    hole: { x:()=>W/2, y:()=>Math.max(70,H*0.22), r:()=>HOLE_RADIUS },
    t:0, streamAcc:0, effects:[], maxBalls:1500, clear:false
  };

  var pointer = { down:false, x:0, y:0 };
  function setAimFromPointer(){ state.aim.fromX=W/2; state.aim.fromY=H-60; state.aim.toX=pointer.x; state.aim.toY=pointer.y; state.aim.active=true; }
  function isUiTarget(el){ return !!(el && el.closest && el.closest('#ui, #testbar, #tip')); }
  function onDown(e){ pointer.down=true; updateXY(e); setAimFromPointer(); spawnBurst(); if(e && e.preventDefault) e.preventDefault(); }
  function onMove(e){ updateXY(e); if(pointer.down){ setAimFromPointer(); } }
  function onUp(){ pointer.down=false; state.aim.active=false; }
  function updateXY(e){
    if(e && e.touches && e.touches[0]){ pointer.x=e.touches[0].clientX; pointer.y=e.touches[0].clientY; }
    else if(e && e.changedTouches && e.changedTouches[0]){ pointer.x=e.changedTouches[0].clientX; pointer.y=e.changedTouches[0].clientY; }
    else if(e){ pointer.x=e.clientX; pointer.y=e.clientY; }
  }
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  function handleDocDown(e){ if(isUiTarget(e.target)) return; onDown(e); }
  document.addEventListener('touchstart', handleDocDown, {passive:false});
  document.addEventListener('mousedown', handleDocDown);

  var RNG = { rand:(a,b)=>a+Math.random()*(b-a), randInt:(a,b)=>Math.floor(a+Math.random()*(b-a+1)) };
  var BALL_R = 5;
  function makeBall(x,y,vx,vy){ return {x,y,vx,vy,r:BALL_R,alive:true,scored:false}; }

  function baseAim(){ var fromX=W/2, fromY=H-60; var tx=(state.aim.toX??state.hole.x()); var ty=(state.aim.toY??state.hole.y()); var baseAng=Math.atan2(ty-fromY,tx-fromX); return {fromX,fromY,baseAng}; }

  function spawnBurst(){
    if(state.clear) return;
    var base = baseAim(); var a = base.baseAng; var fromX = base.fromX, fromY = base.fromY;
    for(var i=0;i<BALLS_COUNT;i++){
      var px=fromX, py=fromY; var delta=(RNG.rand(-SPREAD_DEG/2,SPREAD_DEG/2))*Math.PI/180; var ang=a+delta; var vx=Math.cos(ang)*SPEED; var vy=Math.sin(ang)*SPEED; state.balls.push(makeBall(px,py,vx,vy));
    }
    pruneIfNeeded(); state.roundActive=true; ui.msg.textContent='発射！';
  }

  function spawnStream(dt){ if(!ui.stream.checked || state.clear) return; state.streamAcc += STREAM_RATE * dt; var makeN = Math.floor(state.streamAcc); state.streamAcc -= makeN; if(makeN<=0) return; var base = baseAim(); var a = base.baseAng; var fromX = base.fromX, fromY = base.fromY; for(var i=0;i<makeN;i++){ var px=fromX, py=fromY; var delta=(RNG.rand(-SPREAD_DEG/2,SPREAD_DEG/2))*Math.PI/180; var ang=a+delta; var vx=Math.cos(ang)*SPEED*0.9; var vy=Math.sin(ang)*SPEED*0.9; state.balls.push(makeBall(px,py,vx,vy)); } pruneIfNeeded(); state.roundActive=true; }

  function pruneIfNeeded(){ if(state.balls.length>state.maxBalls){ state.balls.splice(0,state.balls.length-state.maxBalls); } }

  function checkScored(b){ var hx=state.hole.x(), hy=state.hole.y(), hr=state.hole.r(); var dx=b.x-hx, dy=b.y-hy; var dist=Math.hypot(dx,dy); return dist <= (hr - b.r); }

  var grid = new Map(); var CELL = BALL_R*3;
  function cellKey(x,y){ return ((x/CELL)|0)+','+((y/CELL)|0); }
  function buildGrid(){ grid.clear(); var arr=state.balls; for(var i=0;i<arr.length;i++){ var b=arr[i]; if(!b.alive) continue; var k=cellKey(b.x,b.y); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(i); } }
  function softCollisions(){ var arr=state.balls; for(var i=0;i<arr.length;i++){ var b=arr[i]; if(!b.alive) continue; var cx=(b.x/CELL)|0, cy=(b.y/CELL)|0; for(var gx=cx-1; gx<=cx+1; gx++){ for(var gy=cy-1; gy<=cy+1; gy++){ var list=grid.get(gx+','+gy); if(!list) continue; for (const j of list){ if(j<=i) continue; var o=arr[j]; if(!o.alive) continue; var dx=b.x-o.x, dy=b.y-o.y; var d2=dx*dx+dy*dy; var minD=(b.r+o.r); if(d2>0 && d2<minD*minD){ var d=Math.sqrt(d2); var nx=dx/d, ny=dy/d; var overlap=(minD-d)*0.5; b.x+=nx*overlap; b.y+=ny*overlap; o.x-=nx*overlap; o.y-=ny*overlap; var relVx=b.vx-o.vx, relVy=b.vy-o.vy; var relDot=relVx*nx+relVy*ny; if(relDot<0){ var jimp=-(1.0)*relDot; b.vx+=nx*jimp; b.vy+=ny*jimp; o.vx-=nx*jimp; o.vy-=ny*jimp; } } } } } } }

  function drift(x,y,t){ var s=0.0009; var u=Math.sin((x*0.01)+t*0.6)+Math.cos((y*0.012)-t*0.4); var v=Math.cos((x*0.008)-t*0.5)-Math.sin((y*0.01)+t*0.7); return {dx:u*s, dy:v*s}; }

  var last=performance.now();
  function step(){ var now=performance.now(); var dt=(now-last)/1000; if(dt>0.05) dt=0.05; last=now; state.t+=dt; if(!state.clear){ spawnStream(dt); }
    for (const b of state.balls){ if(!b.alive) continue; var d=drift(b.x,b.y,state.t); b.vx+=d.dx; b.vy+=d.dy; b.x+=b.vx; b.y+=b.vy; var e=0.995; if(b.x<b.r){ b.x=b.r; b.vx=-b.vx*e; } if(b.x>W-b.r){ b.x=W-b.r; b.vx=-b.vx*e; } if(b.y<b.r){ b.y=b.r; b.vy=-b.vy*e; } if(b.y>H-b.r){ b.y=H-b.r; b.vy=-b.vy*e; } if(!b.scored && checkScored(b)){ b.scored=true; b.alive=false; state.scored++; ui.score.textContent=state.scored; spawnScoreFx(b.x,b.y); if(state.scored>=300 && !state.clear){ state.clear=true; ui.msg.textContent='🎉 クリア！300個入りました！'; } } }
    buildGrid(); softCollisions(); for (const fx of state.effects){ fx.age += dt; } state.effects = state.effects.filter(fx=>fx.age<fx.life); }

  function spawnScoreFx(x,y){ state.effects.push({x,y,age:0,life:0.8}); }

  var starField = Array.from({length:80},()=>({ x:Math.random(), y:Math.random(), s:Math.random()*2+0.5, a:Math.random()*0.4+0.05 }));
  function drawStars(){ ctx.save(); for (const st of starField){ var x=st.x*W, y=st.y*H; ctx.globalAlpha=st.a + Math.sin((performance.now()/1000 + st.x*7 + st.y*3))*0.05; ctx.beginPath(); ctx.arc(x,y,st.s,0,Math.PI*2); ctx.fillStyle='#ffffff'; ctx.fill(); } ctx.restore(); }

  function draw(){ ctx.globalAlpha=0.18; ctx.fillStyle='#0f1220'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; drawStars(); var hx=state.hole.x(), hy=state.hole.y(), hr=state.hole.r(); ctx.save(); var grd=ctx.createRadialGradient(hx,hy,hr*0.2,hx,hy,hr); grd.addColorStop(0,'rgba(157,255,106,0.35)'); grd.addColorStop(1,'rgba(106,231,255,0.12)'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(hx,hy, hr+10, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(hx,hy, hr, 0, Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fill(); ctx.strokeStyle='rgba(106,231,255,0.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx,hy, hr-6, 0, Math.PI*2); ctx.stroke(); ctx.restore(); ctx.fillStyle='#8B4513'; for (const b of state.balls){ if(!b.alive) continue; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); } for (const fx of state.effects){ var p=fx.age/fx.life; var rr=8+p*32; ctx.beginPath(); ctx.arc(fx.x,fx.y,rr,0,Math.PI*2); ctx.strokeStyle=`rgba(255,255,255,${1-p})`; ctx.lineWidth=2; ctx.stroke(); } }

  function loop(){ step(); draw(); requestAnimationFrame(loop); }
  loop();
  </script>
</body>
</html>
