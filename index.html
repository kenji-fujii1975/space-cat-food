
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zero-G Toss (Cat Hole)</title>
  <style>
    :root{ --bg:#0f1220; --panel:#181c2f; --text:#e6e8f2; --muted:#8a90ad; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; background:radial-gradient(1200px 800px at 50% 20%, #161a2d, var(--bg)); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
      overscroll-behavior:none; touch-action:none;
    }
    #ui{ position:fixed; inset:env(safe-area-inset-top) 0 auto 0; z-index:10; padding:8px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .panel{ background:rgba(24,28,47,0.75); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:8px 10px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
    #score{ font-weight:800; letter-spacing:0.5px; }
    #message{ font-size:13px; color:var(--muted); }
    #canvas{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
    #footer{ position:fixed; inset:auto 0 env(safe-area-inset-bottom) 0; z-index:10; display:flex; justify-content:center; pointer-events:none; }
    #tip{ pointer-events:auto; margin:10px; padding:8px 12px; border-radius:12px; background:rgba(24,28,47,0.6); border:1px solid rgba(255,255,255,0.08); font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel" style="gap:14px">
      <span>入った数: <b id="score">0</b></span>
      <span id="message"></span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="footer">
    <div id="tip">
      画面のどこでも<strong>タップで一斉発射（50個）</strong><br>
      300個穴に入るとクリア。穴は透明ですが判定は有効です。<br>
      背景: back.png / 猫画像: cataan.png
    </div>
  </div>

  <script>
  if (typeof window.SPEED === 'undefined') window.SPEED = 1.5;
  if (typeof window.SPREAD_DEG === 'undefined') window.SPREAD_DEG = 22;
  if (typeof window.HOLE_RADIUS === 'undefined') window.HOLE_RADIUS = 52;
  if (typeof window.BALLS_COUNT === 'undefined') window.BALLS_COUNT = 50;
  var SPEED = window.SPEED, SPREAD_DEG = window.SPREAD_DEG, HOLE_RADIUS = window.HOLE_RADIUS, BALLS_COUNT = window.BALLS_COUNT;

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  var W = 0, H = 0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  var ui = { score: document.getElementById('score'), msg: document.getElementById('message') };

  var state = {
    balls: [], scored: 0, roundActive: false, clear:false,
    aim: { fromX:null, fromY:null, toX:null, toY:null, active:false },
    t:0
  };

  var pointer = { down:false, x:0, y:0 };
  function setAimFromPointer(){ state.aim.fromX=W/2; state.aim.fromY=H-60; state.aim.toX=pointer.x; state.aim.toY=pointer.y; state.aim.active=true; }
  function isUiTarget(el){ return !!(el && el.closest && el.closest('#ui, #tip')); }
  function updateXY(e){
    if(e && e.touches && e.touches[0]){ pointer.x=e.touches[0].clientX; pointer.y=e.touches[0].clientY; }
    else if(e && e.changedTouches && e.changedTouches[0]){ pointer.x=e.changedTouches[0].clientX; pointer.y=e.changedTouches[0].clientY; }
    else if(e){ pointer.x=e.clientX; pointer.y=e.clientY; }
  }
  function onDown(e){ if(isUiTarget(e.target)) return; pointer.down=true; updateXY(e); setAimFromPointer(); spawnBurst(); if(e && e.preventDefault) e.preventDefault(); }
  document.addEventListener('touchstart', onDown, {passive:false});
  document.addEventListener('mousedown', onDown);

  var RNG = { rand:(a,b)=>a+Math.random()*(b-a) };
  var BALL_R = 5;
  function makeBall(x,y,vx,vy){ return {x:x,y:y,vx:vx,vy:vy,r:BALL_R,alive:true,scored:false}; }

  function baseAim(){ var fromX=W/2, fromY=H-60; var tx=(state.aim.toX!=null?state.aim.toX:W/2); var ty=(state.aim.toY!=null?state.aim.toY:Math.max(70,H*0.22)); var baseAng=Math.atan2(ty-fromY,tx-fromX); return {fromX:fromX,fromY:fromY,baseAng:baseAng}; }

  function spawnBurst(){
    if(state.clear) return;
    var base = baseAim(); var a = base.baseAng; var fromX = base.fromX, fromY = base.fromY;
    for(var i=0;i<BALLS_COUNT;i++){
      var px=fromX, py=fromY; var delta=(RNG.rand(-SPREAD_DEG/2,SPREAD_DEG/2))*Math.PI/180; var ang=a+delta; var vx=Math.cos(ang)*SPEED; var vy=Math.sin(ang)*SPEED; state.balls.push(makeBall(px,py,vx,vy));
    }
    if(state.balls.length>2000) state.balls.splice(0,state.balls.length-2000);
    state.roundActive=true; ui.msg.textContent='発射！';
  }

  function hole(){ return { x:W/2, y:Math.max(70,H*0.22), r:HOLE_RADIUS }; }
  function checkScored(b){ var h=hole(); var dx=b.x-h.x, dy=b.y-h.y; var dist=Math.hypot(dx,dy); return dist <= (h.r - b.r); }

  var bgImg = new Image();
  bgImg.src = "back.png";
  var catImg = new Image();
  catImg.src = "cataan.png";

  var MOUTH_NX = 0.50;
  var MOUTH_NY = 0.48; // 画面中央より少し上に配置
  var IMG_SCALE = 0.42;

  function step(){
    for (var i=0;i<state.balls.length;i++){
      var b=state.balls[i]; if(!b.alive) continue;
      b.x += b.vx; b.y += b.vy;
      if(!b.scored && checkScored(b)){
        b.scored=true; b.alive=false;
        state.scored++;
        ui.score.textContent=state.scored;
        if(state.scored>=300 && !state.clear){
          state.clear=true;
          ui.msg.textContent='🎉 クリア！300個入りました！';
        }
      }
    }
  }

  function draw(){
    ctx.drawImage(bgImg,0,0,W,H);
    var h = hole();
    if (catImg.complete) {
      var imgW = Math.min(W * IMG_SCALE, 420);
      var imgH = imgW * (catImg.naturalHeight / catImg.naturalWidth);
      var mouthX = imgW * MOUTH_NX;
      var mouthY = imgH * MOUTH_NY;
      var drawX = h.x - mouthX;
      var drawY = h.y - mouthY;
      ctx.drawImage(catImg, drawX, drawY, imgW, imgH);
    }
    ctx.fillStyle = '#8B4513';
    for (var i=0;i<state.balls.length;i++){
      var b=state.balls[i]; if(!b.alive) continue;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }
  }

  function loop(){ step(); draw(); requestAnimationFrame(loop); }
  loop();
  </script>
</body>
</html>
